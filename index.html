<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avance Litoral Norte</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0efe9;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .container { width: 100%; max-width: 420px; text-align: center; }
  .logo {
    width: 64px; height: 64px; background: #2E5C1E;
    border-radius: 18px; display: flex; align-items: center;
    justify-content: center; margin: 0 auto 20px; font-size: 32px;
  }
  h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .org { font-size: 13px; color: #6b6b6b; margin-bottom: 28px; }
  .update-box {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; border: 0.5px solid rgba(0,0,0,0.12);
    border-radius: 20px; padding: 6px 14px;
    font-size: 12px; color: #6b6b6b; margin-bottom: 28px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #2E5C1E; flex-shrink: 0; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn {
    display: flex; flex-direction: column; align-items: center;
    gap: 12px; padding: 20px 12px; background: #fff;
    border: 0.5px solid rgba(0,0,0,0.1); border-radius: 16px;
    text-decoration: none; color: #1a1a1a;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { opacity: 0.8; }
  .btn-icon {
    width: 52px; height: 52px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .harvest { background: #DDEEFF; }
  .sowing  { background: #E2EFDA; }
  .btn-label { font-size: 15px; font-weight: 500; }
  .btn-sub   { font-size: 12px; color: #6b6b6b; margin-top: 2px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .pulsing { animation: pulse 1.5s infinite; }

</style>
</head>
<body>
<div class="container">
  <div class="logo">🌿</div>
  <h1>Avance Litoral Norte</h1>
  <p class="org">Ceibos Group · Campaña 2025/26</p>
  <div class="update-box">
    <div class="dot" id="dot"></div>
    <span id="lbl" class="pulsing">Cargando...</span>
  </div>
  <div class="btn-grid">
    <a href="cosecha.html" class="btn">
      <div class="btn-icon harvest">🌾</div>
      <div><div class="btn-label">Cosecha</div><div class="btn-sub">Soja 1ra y 2da</div></div>
    </a>
    <a href="siembra.html" class="btn">
      <div class="btn-icon sowing">🌱</div>
      <div><div class="btn-label">Siembra</div><div class="btn-sub">Invierno 2026</div></div>
    </a>
  </div>
  <div style="display:flex;justify-content:center;margin-top:14px;">
    <button id="pdf-btn-index" onclick="generarPDFResumen()" style="display:flex;align-items:center;gap:5px;padding:6px 14px;background:rgba(46,92,30,0.1);color:#2E5C1E;border:0.5px solid rgba(46,92,30,0.3);border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;">⬇ PDF resumen</button>
  </div>
</div>
<script>
fetch('avance.xlsx?t='+Date.now()).then(r=>r.arrayBuffer()).then(()=>{
  const d = new Date();
  document.getElementById('lbl').textContent = 'Actualizado ' + d.toLocaleDateString('es-UY',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('lbl').classList.remove('pulsing');
}).catch(()=>{
  document.getElementById('lbl').textContent = 'Campaña 2025/26';
  document.getElementById('dot').style.background='#aaa';
  document.getElementById('lbl').classList.remove('pulsing');
});
</script>


<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
function generarPDFResumen(){
  const btn=document.getElementById('pdf-btn-index');
  btn.textContent='...';btn.disabled=true;
  fetch('avance.xlsx?t='+Date.now())
    .then(r=>r.arrayBuffer())
    .then(buf=>{
      const X=window.XLSX||XLSX;
      const wb=X.read(buf,{type:'array'});
      const {jsPDF}=window.jspdf;
      const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
      const W=210, M=12, CW=W-M*2;
      let y=0;
      const fecha=new Date().toLocaleDateString('es-UY',{day:'2-digit',month:'2-digit',year:'numeric'});
      const fN=(n,d=0)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('es-UY',{minimumFractionDigits:d,maximumFractionDigits:d});
      const dSign=(n)=>n==null?'—':(n>=0?'+':'')+fN(n);
      const dPct=(n,base)=>(!n||!base)?'':' ('+(n>=0?'+':'')+(n/base*100).toFixed(1)+'%)';

      // ── HEADER ──
      doc.setFillColor(30,60,20);
      doc.rect(0,0,W,22,'F');
      doc.setTextColor(255,255,255);
      doc.setFontSize(15);doc.setFont('helvetica','bold');
      doc.text('Resumen Semanal — Litoral Norte',M,10);
      doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(200,230,200);
      doc.text('Ceibos Group Uruguay · Campaña 2025/26',M,16);
      doc.text(fecha,W-M,16,{align:'right'});
      y=28;

      // ══════════════════════════════
      // COSECHA
      // ══════════════════════════════
      const wsCos=wb.Sheets['Avance cosecha'];
      const rowsCos=wsCos?X.utils.sheet_to_json(wsCos,{header:1,defval:null}):[];
      const cosMap={};
      for(let i=1;i<rowsCos.length;i++){
        const r=rowsCos[i];
        if(!r[0]||typeof r[0]!=='string'||r[0].startsWith('RESUMEN'))break;
        const cv=String(r[5]||'').trim();
        if(!cv)continue;
        const k=r[0]+'||'+cv;
        if(!cosMap[k])cosMap[k]={campo:r[0],cv,ha:0,hacos:0,prod:0,estP:0,estH:0};
        const ha=parseFloat(r[2])||0,hc=parseFloat(r[10])||0,ri=parseFloat(r[11])||0,es=parseFloat(r[9])||0;
        cosMap[k].ha+=ha;cosMap[k].hacos+=hc;
        if(hc>0&&ri>0)cosMap[k].prod+=hc*ri;
        if(ha>0&&es>0){cosMap[k].estP+=ha*es;cosMap[k].estH+=ha;}
      }
      const cosRows=Object.values(cosMap).sort((a,b)=>a.cv.localeCompare(b.cv)||a.campo.localeCompare(b.campo));
      const tC={ha:0,hc:0,prod:0,estP:0,estH:0};
      cosRows.forEach(r=>{tC.ha+=r.ha;tC.hc+=r.hacos;tC.prod+=r.prod;tC.estP+=r.estP;tC.estH+=r.estH;});
      const gR=tC.hc>0?Math.round(tC.prod/tC.hc):0;
      const gE=tC.estH>0?Math.round(tC.estP/tC.estH):0;
      const gPct=tC.ha>0?Math.round(tC.hc/tC.ha*100):0;
      const gD=gR&&gE?gR-gE:null;

      // Section label
      doc.setFillColor(31,78,121);
      doc.roundedRect(M,y,CW,7,1,1,'F');
      doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');
      doc.text('COSECHA SOJA',M+3,y+5);
      y+=10;

      // 4 KPI cards
      const kW=(CW-6)/4;
      const kpis=[
        {lbl:'Avance global',val:gPct+'%',sub:fN(tC.hc)+' / '+fN(tC.ha)+' ha',subC:[80,80,80]},
        {lbl:'Rinde global',val:fN(gR)+' kg/ha',sub:'Estimado: '+fN(gE)+' kg/ha',subC:[80,80,80]},
        {lbl:'Desvío (kg/ha)',val:(gD!=null?(gD>=0?'+':'')+fN(gD):' — '),sub:'',subC:gD<0?[192,0,0]:[46,92,30],valC:gD<0?[192,0,0]:gD>0?[46,92,30]:[40,40,40]},
        {lbl:'Desvío (%)',val:(gD&&gE?(gD>=0?'+':'')+(gD/gE*100).toFixed(1)+'%':'—'),sub:'',subC:[80,80,80],valC:gD<0?[192,0,0]:gD>0?[46,92,30]:[40,40,40]},
      ];
      kpis.forEach((k,i)=>{
        const x=M+i*(kW+2);
        doc.setFillColor(240,245,252);doc.roundedRect(x,y,kW,18,2,2,'F');
        doc.setFillColor(31,78,121);doc.roundedRect(x,y,2,18,1,1,'F');
        doc.setTextColor(100,100,100);doc.setFontSize(6.5);doc.setFont('helvetica','normal');
        doc.text(k.lbl,x+4,y+5);
        doc.setTextColor(...(k.valC||[20,20,20]))));doc.setFontSize(12);doc.setFont('helvetica','bold');
        doc.text(k.val,x+4,y+13);
        if(k.sub){doc.setTextColor(k.subC[0],k.subC[1],k.subC[2]);doc.setFontSize(6.5);doc.setFont('helvetica','normal');doc.text(k.sub,x+4,y+17);}
      });
      y+=22;

      // Table header
      const cCols=[
        {t:'Campo',x:M,w:42,r:false},
        {t:'Cult.',x:M+43,w:12,r:false},
        {t:'Ha',x:M+57,w:16,r:true},
        {t:'Cosech.',x:M+75,w:18,r:true},
        {t:'Av.',x:M+95,w:10,r:true},
        {t:'Rinde',x:M+107,w:18,r:true},
        {t:'Desv. kg',x:M+127,w:20,r:true},
        {t:'Desv. %',x:M+CW,w:0,r:true},
      ];
      doc.setFillColor(210,225,242);doc.rect(M,y,CW,6,'F');
      doc.setTextColor(31,78,121);doc.setFontSize(7);doc.setFont('helvetica','bold');
      cCols.forEach(col=>doc.text(col.t,col.r?col.x+col.w:col.x+2,y+4.5,col.r?{align:'right'}:{}));
      y+=7;

      let rn=0;
      cosRows.forEach(r=>{
        const ri=r.hacos>0?Math.round(r.prod/r.hacos):null;
        const es=r.estH>0?Math.round(r.estP/r.estH):null;
        const pct=r.ha>0?Math.round(r.hacos/r.ha*100):0;
        const dv=ri&&es?ri-es:null;
        const dp=dv&&es?dv/es*100:null;
        doc.setFillColor(...(rn%2===0?[255,255,255]:[244,249,255]));doc.rect(M,y,CW,6.5,'F');
        doc.setTextColor(30,30,30);doc.setFontSize(7.5);doc.setFont('helvetica','normal');
        doc.text(r.campo,M+2,y+4.8);
        doc.text(r.cv,M+45,y+4.8);
        doc.text(fN(r.ha),M+73,y+4.8,{align:'right'});
        doc.text(r.hacos>0?fN(r.hacos):'—',M+93,y+4.8,{align:'right'});
        doc.text(pct+'%',M+105,y+4.8,{align:'right'});
        doc.text(ri?fN(ri):'—',M+125,y+4.8,{align:'right'});
        if(dv!=null){
          const dc=dv<0?[192,0,0]:[46,92,30];
          doc.setTextColor(dc[0],dc[1],dc[2]);doc.setFont('helvetica','bold');
          doc.text(dSign(dv),M+147,y+4.8,{align:'right'});
          doc.text((dp>=0?'+':'')+dp.toFixed(1)+'%',M+CW,y+4.8,{align:'right'});
        }
        y+=6.5;rn++;
        if(y>272){doc.addPage();y=14;}
      });

      // Total cosecha
      doc.setFillColor(210,225,242);doc.rect(M,y,CW,7,'F');
      doc.setTextColor(31,78,121);doc.setFontSize(8);doc.setFont('helvetica','bold');
      doc.text('TOTAL',M+2,y+5);
      doc.text(fN(tC.ha),M+73,y+5,{align:'right'});
      doc.text(fN(tC.hc),M+93,y+5,{align:'right'});
      doc.text(gPct+'%',M+105,y+5,{align:'right'});
      doc.text(fN(gR),M+125,y+5,{align:'right'});
      if(gD!=null){
        doc.setTextColor(...(gD<0?[192,0,0]:[46,92,30]));
        doc.setTextColor(...(gD<0?[192,0,0]:[46,92,30]));
        doc.text(dSign(gD),M+147,y+5,{align:'right'});
        doc.text((gD/gE*100>=0?'+':'')+(gD/gE*100).toFixed(1)+'%',M+CW,y+5,{align:'right'});
      }
      y+=12;
      if(y>240){doc.addPage();y=14;}

      // ══════════════════════════════
      // SIEMBRA
      // ══════════════════════════════
      // Resiembra leída de col 10 (ha Resembradas)
      const wsSiem=wb.Sheets['Avance de siembra'];
      const rowsSiem=wsSiem?X.utils.sheet_to_json(wsSiem,{header:1,defval:null}):[];
      const siemMap={};
      for(let i=1;i<rowsSiem.length;i++){
        const r=rowsSiem[i];
        if(!r[0]||typeof r[0]!=='string'||r[0].startsWith('RESUMEN'))break;
        const cult=String(r[3]||'').trim();
        if(!['Cz','Tr','Ceb'].includes(cult))continue;
        const k=r[0]+'||'+cult;
        if(!siemMap[k])siemMap[k]={campo:r[0],cult,ha:0,semb:0,resemb:0};
        siemMap[k].ha+=parseFloat(r[2])||0;
        siemMap[k].semb+=parseFloat(r[4])||0;
        siemMap[k].resemb+=parseFloat(r[10])||0;
      }
      const cultLabel={'Cz':'Colza','Tr':'Trigo','Ceb':'Cebada'};
      const cultColor={'Cz':[46,92,30],'Tr':[31,78,121],'Ceb':[180,80,20]};
      const siemRows=Object.values(siemMap).sort((a,b)=>{
        const ord={'Cz':0,'Tr':1,'Ceb':2};
        return (ord[a.cult]??9)-(ord[b.cult]??9)||a.campo.localeCompare(b.campo);
      });
      siemRows.forEach(s=>{
        s.riesgo=s.resemb;
        s.efec=Math.max(0,s.semb-s.riesgo);
      });
      const tS={ha:0,semb:0,riesgo:0,efec:0};
      siemRows.forEach(s=>{tS.ha+=s.ha;tS.semb+=s.semb;tS.riesgo+=s.riesgo;tS.efec+=s.efec;});
      const sPct=tS.ha>0?Math.round(tS.efec/tS.ha*100):0;
      const sSembPct=tS.ha>0?Math.round(tS.semb/tS.ha*100):0;

      // Section label
      doc.setFillColor(46,92,30);doc.roundedRect(M,y,CW,7,1,1,'F');
      doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');
      doc.text('SIEMBRA INVIERNO 2026',M+3,y+5);
      y+=10;

      // KPI cards siembra - per cultivo
      const cultivos=[...new Set(siemRows.map(s=>s.cult))];
      const nCult=cultivos.length+1; // +1 for total
      const sKW=(CW-(nCult-1)*2)/nCult;
      const cultStats={};
      cultivos.forEach(cv=>{
        const rows=siemRows.filter(s=>s.cult===cv);
        const ha=rows.reduce((s,r)=>s+r.ha,0);
        const semb=rows.reduce((s,r)=>s+r.semb,0);
        const riesgo=rows.reduce((s,r)=>s+r.riesgo,0);
        const efec=Math.max(0,semb-riesgo);
        cultStats[cv]={ha,semb,riesgo,efec,pctEfec:ha>0?Math.round(efec/ha*100):0,pctSemb:ha>0?Math.round(semb/ha*100):0};
      });
      [...cultivos,'TOT'].forEach((cv,i)=>{
        const x=M+i*(sKW+2);
        const isTotal=cv==='TOT';
        const st=isTotal?{ha:tS.ha,efec:tS.efec,semb:tS.semb,riesgo:tS.riesgo,pctEfec:sPct,pctSemb:sSembPct}:cultStats[cv];
        const col=isTotal?[46,92,30]:(cultColor[cv]||[80,80,80]);
        doc.setFillColor(235,245,232);doc.roundedRect(x,y,sKW,22,2,2,'F');
        doc.setFillColor(...col);doc.roundedRect(x,y,2,22,1,1,'F');
        doc.setTextColor(80,80,80);doc.setFontSize(6.5);doc.setFont('helvetica','normal');
        doc.text(isTotal?'Total invierno':cultLabel[cv],x+4,y+5);
        doc.setTextColor(col[0],col[1],col[2]);doc.setFontSize(14);doc.setFont('helvetica','bold');
        doc.text(st.pctEfec+'%',x+4,y+14);
        doc.setFontSize(6.5);doc.setFont('helvetica','normal');doc.setTextColor(80,80,80);
        doc.text(fN(st.efec)+' / '+fN(st.ha)+' ha',x+4,y+20);
        // Resiembra badge
        if(st.riesgo>0){
          doc.setTextColor(192,0,0);
          doc.text('⚠ '+fN(st.riesgo)+' ha resiembra',x+4,y+20);
        }
      });
      y+=27;

      // Table siembra
      const sCols=[
        {t:'Campo',x:M,w:44,r:false},
        {t:'Cultivo',x:M+46,w:18,r:false},
        {t:'Ha',x:M+74,w:16,r:true},
        {t:'Sembradas',x:M+102,w:22,r:true},
        {t:'Resiembra',x:M+126,w:22,r:true},
        {t:'Efectivas',x:M+150,w:20,r:true},
        {t:'Avance',x:M+CW,w:0,r:true},
      ];
      doc.setFillColor(215,235,210);doc.rect(M,y,CW,6,'F');
      doc.setTextColor(46,92,30);doc.setFontSize(7);doc.setFont('helvetica','bold');
      sCols.forEach(col=>doc.text(col.t,col.r?col.x+col.w:col.x+2,y+4.5,col.r?{align:'right'}:{}));
      y+=7;

      rn=0;
      siemRows.forEach(s=>{
        const pctEfec=s.ha>0?Math.round(s.efec/s.ha*100):0;
        const pctSemb=s.ha>0?Math.round(s.semb/s.ha*100):0;
        doc.setFillColor(...(rn%2===0?[255,255,255]:[246,250,244]));doc.rect(M,y,CW,7,'F');
        // Resiembra row: highlight left border
        if(s.riesgo>0){doc.setFillColor(192,0,0);doc.rect(M,y,2,7,'F');}
        doc.setTextColor(30,30,30);doc.setFontSize(7.5);doc.setFont('helvetica','normal');
        doc.text(s.campo,M+3,y+5);
        doc.text(cultLabel[s.cult]||s.cult,M+48,y+5);
        doc.text(fN(s.ha),M+90,y+5,{align:'right'});
        doc.text(s.semb>0?fN(s.semb):'—',M+124,y+5,{align:'right'});
        if(s.riesgo>0){
          doc.setTextColor(192,0,0);doc.setFont('helvetica','bold');
          doc.text(fN(s.riesgo),M+148,y+5,{align:'right'});
          doc.setTextColor(30,30,30);doc.setFont('helvetica','normal');
          doc.text(fN(s.efec),M+170,y+5,{align:'right'});
          // Show both pcts
          doc.setTextColor(192,0,0);doc.setFontSize(6.5);
          doc.text(pctSemb+'%→'+pctEfec+'%',M+CW,y+5,{align:'right'});
        } else {
          doc.text('—',M+148,y+5,{align:'right'});
          doc.text(s.efec>0?fN(s.efec):'—',M+170,y+5,{align:'right'});
          doc.setTextColor(...(s.efec>0?[30,30,30]:[160,160,160]));
          doc.text(pctEfec>0?pctEfec+'%':'0%',M+CW,y+5,{align:'right'});
        }
        y+=7;rn++;
        if(y>278){doc.addPage();y=14;}
      });

      // Total siembra
      doc.setFillColor(210,235,205);doc.rect(M,y,CW,7,'F');
      doc.setTextColor(46,92,30);doc.setFontSize(8);doc.setFont('helvetica','bold');
      doc.text('TOTAL',M+2,y+5);
      doc.text(fN(tS.ha),M+90,y+5,{align:'right'});
      doc.text(fN(tS.semb),M+124,y+5,{align:'right'});
      if(tS.riesgo>0){doc.setTextColor(192,0,0);doc.text(fN(tS.riesgo),M+148,y+5,{align:'right'});}
      doc.setTextColor(46,92,30);
      doc.text(fN(tS.efec),M+170,y+5,{align:'right'});
      if(tS.riesgo>0){
        doc.setTextColor(192,0,0);doc.setFontSize(7);
        doc.text(sSembPct+'%→'+sPct+'%',M+CW,y+5,{align:'right'});
      } else {
        doc.setTextColor(46,92,30);doc.text(sPct+'%',M+CW,y+5,{align:'right'});
      }

      // Footer
      doc.setTextColor(180,180,180);doc.setFontSize(7);doc.setFont('helvetica','normal');
      doc.text('Ceibos Group Uruguay · Litoral Norte · '+fecha,W/2,291,{align:'center'});
      doc.save('ResumenSemanal_'+fecha.replace(/\//g,'-')+'.pdf');
    })
    .catch(e=>alert('Error: '+e.message+'\n'+e.stack))
    .finally(()=>{btn.textContent='⬇ PDF resumen';btn.disabled=false;});
}
</script>
</body>
</html>
