<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avance Litoral Norte</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0efe9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-align: center;
    padding: 2rem;
    max-width: 480px;
    width: 100%;
  }
  .logo {
    width: 56px; height: 56px;
    background: #2E5C1E;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
    font-size: 28px;
  }
  h1 {
    font-size: 22px;
    font-weight: 500;
    color: #1a1a1a;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 14px;
    color: #6b6b6b;
    margin-bottom: 2.5rem;
  }
  .week-badge {
    display: inline-block;
    background: #fff;
    border: 0.5px solid rgba(0,0,0,0.12);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    color: #6b6b6b;
    margin-bottom: 2rem;
  }
  .btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 1.5rem 1rem;
    background: #fff;
    border: 0.5px solid rgba(0,0,0,0.12);
    border-radius: 14px;
    text-decoration: none;
    color: #1a1a1a;
    transition: box-shadow 0.15s, transform 0.15s;
    cursor: pointer;
  }
  .btn:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    transform: translateY(-2px);
  }
  .btn:active { transform: scale(0.98); }
  .btn-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .btn-icon.harvest { background: #DDEEFF; }
  .btn-icon.sowing  { background: #E2EFDA; }
  .btn-label {
    font-size: 14px;
    font-weight: 500;
  }
  .btn-sub {
    font-size: 11px;
    color: #6b6b6b;
  }
  .footer {
    margin-top: 2rem;
    font-size: 11px;
    color: #aaa;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">🌿</div>
  <h1>Avance Litoral Norte</h1>
  <p class="subtitle">Ceibos Group Uruguay · Campaña 2025/26</p>
  <div class="week-badge" id="week-label">Cargando...</div>

  <div class="btn-grid">
    <a href="cosecha.html" class="btn">
      <div class="btn-icon harvest">🌾</div>
      <div>
        <div class="btn-label">Cosecha</div>
        <div class="btn-sub">Soja 1ra y 2da</div>
      </div>
    </a>
    <a href="siembra.html" class="btn">
      <div class="btn-icon sowing">🌱</div>
      <div>
        <div class="btn-label">Siembra</div>
        <div class="btn-sub">Invierno 2026</div>
      </div>
    </a>
  </div>

  <div class="footer" id="footer-date"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const XLSX_URL = 'avance.xlsx';

fetch(XLSX_URL + '?t=' + Date.now())
  .then(r => r.arrayBuffer())
  .then(buf => {
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    // Get last modified date from first sheet cell or use today
    const today = new Date();
    const semana = 'Semana ' + today.toLocaleDateString('es-UY', { day:'2-digit', month:'2-digit', year:'numeric' });
    document.getElementById('week-label').textContent = semana;
    document.getElementById('footer-date').textContent = 'Datos actualizados: ' + today.toLocaleDateString('es-UY', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  })
  .catch(() => {
    document.getElementById('week-label').textContent = 'Campaña 2025/26';
  });
</script>
</body>
</html>
