<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosecha · Litoral Norte</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0efe9; color: #1a1a1a; }

  .topbar {
    background: #1F4E79; color: #fff;
    padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  .topbar a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px; }
  .topbar a:hover { color: #fff; }
  .topbar h1 { font-size: 15px; font-weight: 500; flex: 1; }
  .topbar .week { font-size: 12px; opacity: 0.75; }

  .wrapper { max-width: 780px; margin: 0 auto; padding: 16px; }

  .kpi-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 14px; }
  .kpi { background: #fff; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 10px; padding: 10px 14px; }
  .kpi-label { font-size: 11px; color: #6b6b6b; margin-bottom: 2px; }
  .kpi-val { font-size: 20px; font-weight: 500; }
  .kpi-sub { font-size: 11px; color: #6b6b6b; margin-top: 2px; }

  .card { background: #fff; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }

  .cult-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 16px; cursor: pointer; user-select: none;
    transition: background 0.1s;
  }
  .cult-row:hover { background: #f8f8f5; }
  .pill { font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
  .pill-sj1 { background: #DDEEFF; color: #1F4E79; }
  .pill-sj2 { background: #E2EFDA; color: #2E5C1E; }
  .bar-track { flex: 1; height: 10px; background: #e8e8e4; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-sj1 { background: #2E75B6; }
  .bar-sj2 { background: #2E5C1E; }
  .cult-pct { font-size: 14px; font-weight: 500; white-space: nowrap; }
  .cult-meta { font-size: 12px; color: #6b6b6b; white-space: nowrap; }
  .chev { font-size: 11px; color: #999; transition: transform 0.2s; flex-shrink: 0; }
  .chev.open { transform: rotate(90deg); }

  .campo-list { display: none; padding: 0 16px 8px; border-top: 0.5px solid rgba(0,0,0,0.07); background: #fafaf8; }
  .campo-list.open { display: block; }

  .campo-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px; border-radius: 8px; cursor: pointer;
    margin: 2px 0;
  }
  .campo-row:hover { background: #f0efe9; }
  .campo-row.no-data { cursor: default; opacity: 0.5; }
  .campo-name { font-size: 13px; width: 130px; flex-shrink: 0; }
  .mini-wrap { flex: 1; height: 7px; background: #e8e8e4; border-radius: 2px; overflow: hidden; }
  .mini-fill { height: 100%; border-radius: 2px; }
  .campo-pct { font-size: 13px; font-weight: 500; width: 36px; text-align: right; flex-shrink: 0; }
  .campo-rinde { font-size: 12px; color: #6b6b6b; width: 80px; text-align: right; flex-shrink: 0; }
  .campo-desv { font-size: 12px; width: 56px; text-align: right; flex-shrink: 0; font-weight: 500; }

  .lote-list { display: none; margin: 2px 0 6px 10px; border-left: 2px solid #e0e0d8; padding-left: 10px; }
  .lote-list.open { display: block; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  th { text-align: left; font-size: 11px; font-weight: 500; color: #6b6b6b; padding: 4px; border-bottom: 0.5px solid rgba(0,0,0,0.1); }
  th.r { text-align: right; }
  td { padding: 4px; border-bottom: 0.5px solid rgba(0,0,0,0.06); vertical-align: middle; }
  td.r { text-align: right; }
  tr:last-child td { border-bottom: none; }
  .lmini { width: 48px; height: 6px; background: #e8e8e4; border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 4px; }

  .neg { color: #C00000; }
  .pos { color: #2E5C1E; }
  .muted { color: #999; font-style: italic; }

  .loading { text-align: center; padding: 3rem; color: #6b6b6b; font-size: 14px; }
  .error { background: #fff0f0; border: 0.5px solid #f0c0c0; border-radius: 10px; padding: 1rem; color: #C00000; font-size: 13px; margin-bottom: 14px; }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html">← Inicio</a>
  <h1>Cosecha Soja</h1>
  <span class="week" id="week-label"></span>
</div>

<div class="wrapper">
  <div id="error-box" class="error" style="display:none"></div>
  <div id="loading" class="loading">Cargando datos...</div>
  <div id="content" style="display:none">
    <div class="kpi-row" id="kpis"></div>
    <div id="blocks"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const XLSX_URL = 'data/avance.xlsx';

// ── Sheet column indices (0-based) ──
// Avance cosecha: A=Campo B=Lote C=ha D=CultInv E=CultVerano F=CultivoVerano
// G=Variedad H=FSiembra I=SistSiembra J=EstRinde K=HaCosechadas L=RendReal
// M=%avance N=desvio_kg O=desvio_%

const COL = { campo:0, lote:1, ha:2, cultV:5, estRinde:9, hacos:10, rinde:11, avance:12, desvKg:13 };

function fmt(n, dec=0) {
  if (n == null || n === '' || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-UY', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function pct(n) {
  if (n == null || n === '' || isNaN(n)) return '—';
  return Math.round(n * 100) + '%';
}
function desvClass(n) { return n < 0 ? 'neg' : n > 0 ? 'pos' : ''; }
function desvStr(n) {
  if (n == null || isNaN(n)) return '—';
  return (n >= 0 ? '+' : '') + fmt(n);
}

function weightedRinde(lotes) {
  let sumHa = 0, sumProd = 0;
  for (const l of lotes) {
    if (l.hacos > 0 && l.rinde > 0) { sumHa += l.hacos; sumProd += l.hacos * l.rinde; }
  }
  return sumHa > 0 ? sumProd / sumHa : null;
}

function buildBlock(cultivo, campos, barClass, pillClass) {
  // Totals
  const totalHa  = campos.reduce((s, c) => s + c.lotes.reduce((a, l) => a + (l.ha || 0), 0), 0);
  const totalCos = campos.reduce((s, c) => s + c.lotes.reduce((a, l) => a + (l.hacos || 0), 0), 0);
  const avPct    = totalHa > 0 ? totalCos / totalHa : 0;
  const allLotes = campos.flatMap(c => c.lotes);
  const rindePond = weightedRinde(allLotes);
  // Weighted est
  let sumEstHa = 0, sumEst = 0;
  for (const l of allLotes) { if (l.ha > 0 && l.estRinde > 0) { sumEstHa += l.ha; sumEst += l.ha * l.estRinde; } }
  const estPond = sumEstHa > 0 ? sumEst / sumEstHa : null;
  const desv = rindePond && estPond ? rindePond - estPond : null;

  const cultId = cultivo.replace(/\s/g,'').toLowerCase();

  const block = document.createElement('div');
  block.className = 'card';

  // Cult row
  const cultRow = document.createElement('div');
  cultRow.className = 'cult-row';
  cultRow.innerHTML = `
    <span class="pill ${pillClass}">${cultivo}</span>
    <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${Math.round(avPct*100)}%"></div></div>
    <span class="cult-pct">${Math.round(avPct*100)}%</span>
    <span class="cult-meta">${fmt(totalCos)}&thinsp;/&thinsp;${fmt(totalHa)} ha &nbsp;·&nbsp; ${rindePond ? fmt(rindePond)+' kg/ha' : '—'} &nbsp;·&nbsp; <span class="${desvClass(desv)}">${desvStr(desv)}</span></span>
    <span class="chev" id="chev-${cultId}">▶</span>`;
  cultRow.onclick = () => toggleCult(cultId);
  block.appendChild(cultRow);

  // Campo list
  const campoList = document.createElement('div');
  campoList.className = 'campo-list';
  campoList.id = 'campos-' + cultId;

  for (const campo of campos) {
    const cHa  = campo.lotes.reduce((s, l) => s + (l.ha || 0), 0);
    const cCos = campo.lotes.reduce((s, l) => s + (l.hacos || 0), 0);
    const cPct = cHa > 0 ? cCos / cHa : 0;
    const cRinde = weightedRinde(campo.lotes);
    let cEstHa = 0, cEst = 0;
    for (const l of campo.lotes) { if (l.ha > 0 && l.estRinde > 0) { cEstHa += l.ha; cEst += l.ha * l.estRinde; } }
    const cEstPond = cEstHa > 0 ? cEst / cEstHa : null;
    const cDesv = cRinde && cEstPond ? cRinde - cEstPond : null;
    const campoId = cultId + '-' + campo.nombre.replace(/\s/g,'').toLowerCase();
    const hasData = cCos > 0;

    const campoRow = document.createElement('div');
    campoRow.className = 'campo-row' + (hasData ? '' : ' no-data');
    campoRow.innerHTML = `
      <span class="campo-name">${campo.nombre}</span>
      <div class="mini-wrap"><div class="mini-fill ${barClass}" style="width:${Math.round(cPct*100)}%"></div></div>
      <span class="campo-pct">${Math.round(cPct*100)}%</span>
      <span class="campo-rinde">${cRinde ? fmt(cRinde)+' kg/ha' : '—'}</span>
      <span class="campo-desv ${desvClass(cDesv)}">${desvStr(cDesv)}</span>
      ${hasData ? `<span class="chev" id="chev-${campoId}">▶</span>` : '<span style="width:16px"></span>'}`;
    if (hasData) campoRow.onclick = () => toggleCampo(campoId);
    campoList.appendChild(campoRow);

    if (hasData) {
      const loteList = document.createElement('div');
      loteList.className = 'lote-list';
      loteList.id = 'lotes-' + campoId;
      loteList.innerHTML = `<table>
        <thead><tr>
          <th style="width:18%">Lote</th>
          <th style="width:12%" class="r">Ha</th>
          <th style="width:12%" class="r">Cos.</th>
          <th style="width:18%">Av.</th>
          <th style="width:14%" class="r">Est.</th>
          <th style="width:14%" class="r">Real</th>
          <th style="width:12%" class="r">Desvío</th>
        </tr></thead>
        <tbody>${campo.lotes.map(l => {
          const lpct = l.ha > 0 ? Math.round((l.hacos||0)/l.ha*100) : 0;
          const ld = l.rinde && l.estRinde ? l.rinde - l.estRinde : null;
          return `<tr>
            <td>${l.lote}</td>
            <td class="r">${fmt(l.ha,1)}</td>
            <td class="r">${l.hacos > 0 ? fmt(l.hacos,1) : '<span class="muted">—</span>'}</td>
            <td><div class="lmini"><div class="mini-fill ${barClass}" style="width:${lpct}%"></div></div>${lpct}%</td>
            <td class="r">${l.estRinde ? fmt(l.estRinde) : '—'}</td>
            <td class="r">${l.rinde > 0 ? fmt(l.rinde) : '<span class="muted">—</span>'}</td>
            <td class="r ${desvClass(ld)}">${ld != null ? desvStr(ld) : '<span class="muted">—</span>'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
      campoList.appendChild(loteList);
    }
  }

  block.appendChild(campoList);
  return block;
}

function toggleCult(id) {
  const el = document.getElementById('campos-' + id);
  const ch = document.getElementById('chev-' + id);
  if (!el) return;
  const open = el.classList.toggle('open');
  if (ch) ch.classList.toggle('open', open);
}
function toggleCampo(id) {
  const el = document.getElementById('lotes-' + id);
  const ch = document.getElementById('chev-' + id);
  if (!el) return;
  const open = el.classList.toggle('open');
  if (ch) ch.classList.toggle('open', open);
}

// ── Load XLSX ──
fetch(XLSX_URL + '?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('No se pudo cargar el archivo'); return r.arrayBuffer(); })
  .then(buf => {
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const ws = wb.Sheets['Avance cosecha'];
    if (!ws) throw new Error('No se encontró la hoja "Avance cosecha"');
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });

    // Parse rows (skip header row 0)
    const lotes = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const campo = r[COL.campo];
      const cultV = r[COL.cultV];
      if (!campo || !cultV) continue;
      if (typeof campo !== 'string' || campo.startsWith('RESUMEN')) break;
      lotes.push({
        campo, lote: r[COL.lote] != null ? String(r[COL.lote]) : '—',
        cultV: String(cultV).trim(),
        ha: parseFloat(r[COL.ha]) || 0,
        estRinde: parseFloat(r[COL.estRinde]) || 0,
        hacos: parseFloat(r[COL.hacos]) || 0,
        rinde: parseFloat(r[COL.rinde]) || 0,
      });
    }

    // Group by cultivo then campo
    function groupBy(cultivo) {
      const filtered = lotes.filter(l => l.cultV === cultivo);
      const byField = {};
      for (const l of filtered) {
        if (!byField[l.campo]) byField[l.campo] = [];
        byField[l.campo].push(l);
      }
      return Object.entries(byField).map(([nombre, lotes]) => ({ nombre, lotes }));
    }

    const sj1 = groupBy('Sj1');
    const sj2 = groupBy('Sj2');

    // KPIs
    function totalStats(campos) {
      const all = campos.flatMap(c => c.lotes);
      const ha  = all.reduce((s, l) => s + l.ha, 0);
      const cos = all.reduce((s, l) => s + l.hacos, 0);
      const rinde = weightedRinde(all);
      let sEH = 0, sE = 0;
      for (const l of all) { if (l.ha > 0 && l.estRinde > 0) { sEH += l.ha; sE += l.ha * l.estRinde; } }
      const est = sEH > 0 ? sE / sEH : null;
      return { ha, cos, avPct: ha > 0 ? cos/ha : 0, rinde, desv: rinde && est ? rinde - est : null };
    }

    const s1 = totalStats(sj1);
    const s2 = totalStats(sj2);

    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><div class="kpi-label">Sj1 avance</div><div class="kpi-val">${Math.round(s1.avPct*100)}%</div><div class="kpi-sub">${fmt(s1.cos)} / ${fmt(s1.ha)} ha</div></div>
      <div class="kpi"><div class="kpi-label">Sj1 rinde</div><div class="kpi-val">${s1.rinde ? fmt(s1.rinde) : '—'} <span style="font-size:13px">kg/ha</span></div><div class="kpi-sub ${desvClass(s1.desv)}">${s1.desv != null ? desvStr(s1.desv)+' vs est.' : '—'}</div></div>
      <div class="kpi"><div class="kpi-label">Sj2 avance</div><div class="kpi-val">${Math.round(s2.avPct*100)}%</div><div class="kpi-sub">${fmt(s2.cos)} / ${fmt(s2.ha)} ha</div></div>
      <div class="kpi"><div class="kpi-label">Sj2 rinde</div><div class="kpi-val">${s2.rinde ? fmt(s2.rinde) : '—'} <span style="font-size:13px">kg/ha</span></div><div class="kpi-sub ${desvClass(s2.desv)}">${s2.desv != null ? desvStr(s2.desv)+' vs est.' : '—'}</div></div>`;

    const blocks = document.getElementById('blocks');
    blocks.appendChild(buildBlock('Sj1', sj1, 'bar-sj1', 'pill-sj1'));
    blocks.appendChild(buildBlock('Sj2', sj2, 'bar-sj2', 'pill-sj2'));

    document.getElementById('week-label').textContent =
      new Date().toLocaleDateString('es-UY', { day:'2-digit', month:'2-digit', year:'numeric' });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  })
  .catch(err => {
    document.getElementById('loading').style.display = 'none';
    const eb = document.getElementById('error-box');
    eb.textContent = '⚠ ' + err.message + '. Verificá que data/avance.xlsx esté en el repositorio.';
    eb.style.display = 'block';
  });
</script>
</body>
</html>
