<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosecha · Litoral Norte</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0efe9; color: #1a1a1a; }
  .topbar {
    background: #1F4E79; color: #fff;
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  .topbar a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; padding: 4px 0; }
  .topbar h1 { font-size: 16px; font-weight: 500; flex: 1; }
  .topbar .week { font-size: 11px; opacity: 0.7; }
  .wrapper { padding: 12px; max-width: 680px; margin: 0 auto; }
  .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .kpi { background: #fff; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 10px; padding: 10px 12px; }
  .kpi-label { font-size: 11px; color: #6b6b6b; margin-bottom: 2px; }
  .kpi-val { font-size: 20px; font-weight: 500; }
  .kpi-sub { font-size: 11px; margin-top: 2px; }
  .card { background: #fff; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .cult-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; cursor: pointer; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .cult-row:active { background: #f5f5f2; }
  .pill { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
  .pill-sj1 { background: #DDEEFF; color: #1F4E79; }
  .pill-sj2 { background: #E2EFDA; color: #2E5C1E; }
  .bar-track { flex: 1; height: 10px; background: #e8e8e4; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-sj1 { background: #2E75B6; }
  .bar-sj2 { background: #2E5C1E; }
  .cult-pct { font-size: 15px; font-weight: 500; white-space: nowrap; }
  .chev { font-size: 12px; color: #aaa; transition: transform 0.2s; flex-shrink: 0; }
  .chev.open { transform: rotate(90deg); }
  .cult-meta { font-size: 11px; color: #6b6b6b; width: 100%; padding: 0 14px 10px; margin-top: -4px; }
  .campo-list { display: none; border-top: 0.5px solid rgba(0,0,0,0.07); background: #fafaf8; padding: 4px 10px 8px; }
  .campo-list.open { display: block; }
  .campo-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 6px; border-radius: 8px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .campo-row:active { background: #f0efe9; }
  .campo-row.no-data { cursor: default; opacity: 0.5; }
  .campo-name { font-size: 13px; flex: 1; min-width: 0; }
  .mini-wrap { width: 52px; height: 7px; background: #e8e8e4; border-radius: 2px; overflow: hidden; flex-shrink: 0; }
  .mini-fill { height: 100%; border-radius: 2px; }
  .campo-pct { font-size: 13px; font-weight: 500; width: 34px; text-align: right; flex-shrink: 0; }
  .campo-desv { font-size: 11px; width: 46px; text-align: right; flex-shrink: 0; font-weight: 500; }
  .lote-list { display: none; margin: 2px 0 4px 8px; border-left: 2px solid #e0e0d8; padding-left: 8px; }
  .lote-list.open { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-size: 10px; font-weight: 500; color: #6b6b6b; padding: 4px 3px; border-bottom: 0.5px solid rgba(0,0,0,0.1); }
  th.r { text-align: right; }
  td { padding: 4px 3px; border-bottom: 0.5px solid rgba(0,0,0,0.06); vertical-align: middle; font-size: 12px; }
  td.r { text-align: right; }
  tr:last-child td { border-bottom: none; }
  .lmini { width: 36px; height: 5px; background: #e8e8e4; border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 3px; }
  .neg { color: #C00000; }
  .pos { color: #2E5C1E; }
  .muted { color: #999; font-style: italic; }
  .loading { text-align: center; padding: 3rem 1rem; color: #6b6b6b; font-size: 14px; }
  .error { background: #fff0f0; border: 0.5px solid #f0c0c0; border-radius: 10px; padding: 1rem; color: #C00000; font-size: 13px; margin-bottom: 12px; }
  .proy-card { background:#fff; border:0.5px solid rgba(0,0,0,0.1); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .proy-title { font-size:11px;font-weight:500;color:#6b6b6b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px; }
  .proy-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .proy-item { background:#f0efe9; border-radius:8px; padding:10px 12px; }
  .proy-label { font-size:11px; color:#6b6b6b; margin-bottom:2px; }
  .proy-val { font-size:18px; font-weight:600; color:#1a1a1a; }
  .proy-sub { font-size:11px; color:#6b6b6b; margin-top:2px; }
  .proy-bar-wrap { margin-top:10px; }
  .proy-bar-track { height:10px; background:#e8e8e4; border-radius:5px; overflow:visible; position:relative; display:flex; margin-bottom:4px; }
  .proy-seg-real { height:100%; background:#1F4E79; border-radius:5px 0 0 5px; }
  .proy-seg-proy { height:100%; background:#7AB3D9; }
  .proy-seg-pend { height:100%; background:#e8e8e4; border-radius:0 5px 5px 0; }
  .proy-bar-labels { display:flex; justify-content:space-between; font-size:10px; color:#6b6b6b; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html">←</a>
  <h1>Cosecha Soja</h1>
  <span class="week" id="week-label"></span>
  <button id="pdf-btn-cosecha" onclick="generarPDFCosecha()" style="background:rgba(255,255,255,0.15);color:#fff;border:0.5px solid rgba(255,255,255,0.4);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;">⬇ PDF</button>
</div>
<div class="wrapper">
  <div id="error-box" class="error" style="display:none"></div>
  <div id="loading" class="loading">Cargando datos...</div>
  <div id="content" style="display:none">
    
    <div class="kpi-row" id="kpis"></div>
    <div id="proy-card" style="background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:12px;padding:14px 16px;margin-bottom:12px;"></div>
    <div id="blocks"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const XLSX_URL = 'avance.xlsx';
const COL = { campo:0, lote:1, ha:2, cultV:5, estRinde:9, hacos:10, rinde:11 };

function fmt(n,dec=0){ if(n==null||isNaN(n))return'—'; return Number(n).toLocaleString('es-UY',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function desvClass(n){ return n<0?'neg':n>0?'pos':''; }
function desvStr(n){ if(n==null||isNaN(n))return'—'; return(n>=0?'+':'')+fmt(n); }
function weightedRinde(lotes){ let sH=0,sP=0; for(const l of lotes){if(l.hacos>0&&l.rinde>0){sH+=l.hacos;sP+=l.hacos*l.rinde;}} return sH>0?sP/sH:null; }

function buildBlock(cultivo, campos, barClass, pillClass){
  const allLotes = campos.flatMap(c=>c.lotes);
  const totalHa  = allLotes.reduce((s,l)=>s+(l.ha||0),0);
  const totalCos = allLotes.reduce((s,l)=>s+(l.hacos||0),0);
  const avPct    = totalHa>0?totalCos/totalHa:0;
  const rindePond= weightedRinde(allLotes);
  let sEH=0,sE=0;
  for(const l of allLotes){if(l.ha>0&&l.estRinde>0){sEH+=l.ha;sE+=l.ha*l.estRinde;}}
  const estPond = sEH>0?sE/sEH:null;
  const desv = rindePond&&estPond?rindePond-estPond:null;
  const cultId = cultivo.replace(/\s/g,'').toLowerCase();

  const block = document.createElement('div');
  block.className = 'card';

  // Header
  const hdr = document.createElement('div');
  hdr.innerHTML = `
    <div class="cult-row" onclick="toggleEl('campos-${cultId}','chev-${cultId}')">
      <span class="pill ${pillClass}">${cultivo}</span>
      <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${Math.round(avPct*100)}%"></div></div>
      <span class="cult-pct">${Math.round(avPct*100)}%</span>
      <span class="chev" id="chev-${cultId}">▶</span>
    </div>
    <div class="cult-meta">${fmt(totalCos)}&thinsp;/&thinsp;${fmt(totalHa)} ha &nbsp;·&nbsp; ${rindePond?fmt(rindePond)+' kg/ha':'—'} &nbsp;·&nbsp; <span class="${desvClass(desv)}">${desvStr(desv)} vs est.</span></div>`;
  block.appendChild(hdr);

  const campoList = document.createElement('div');
  campoList.className = 'campo-list';
  campoList.id = 'campos-' + cultId;

  for(const campo of campos){
    const cHa   = campo.lotes.reduce((s,l)=>s+(l.ha||0),0);
    const cCos  = campo.lotes.reduce((s,l)=>s+(l.hacos||0),0);
    const cPct  = cHa>0?Math.round(cCos/cHa*100):0;
    const cRinde= weightedRinde(campo.lotes);
    let cEH=0,cE=0; for(const l of campo.lotes){if(l.ha>0&&l.estRinde>0){cEH+=l.ha;cE+=l.ha*l.estRinde;}}
    const cEst  = cEH>0?cE/cEH:null;
    const cDesv = cRinde&&cEst?cRinde-cEst:null;
    const campoId = cultId+'-'+campo.nombre.replace(/\s/g,'').toLowerCase();
    const hasData = cCos>0;

    const cr = document.createElement('div');
    cr.className = 'campo-row'+(hasData?'':' no-data');
    cr.innerHTML = `
      <span class="campo-name">${campo.nombre}</span>
      <div class="mini-wrap"><div class="mini-fill ${barClass}" style="width:${cPct}%"></div></div>
      <span class="campo-pct">${cPct}%</span>
      <span class="campo-desv ${desvClass(cDesv)}">${desvStr(cDesv)}${cDesv!=null&&cEst>0?" ("+( cDesv/cEst*100).toFixed(1)+"%)" :""}</span>
      ${hasData?`<span class="chev" id="chev-${campoId}">▶</span>`:'<span style="width:16px"></span>'}`;
    if(hasData) cr.onclick = ()=>toggleEl('lotes-'+campoId,'chev-'+campoId);
    campoList.appendChild(cr);

    if(hasData){
      const ll = document.createElement('div');
      ll.className = 'lote-list';
      ll.id = 'lotes-' + campoId;
      ll.innerHTML = `<table><thead><tr>
        <th style="width:20%">Lote</th><th style="width:14%" class="r">Ha</th>
        <th style="width:14%" class="r">Cos.</th><th style="width:18%">Av.</th>
        <th style="width:14%" class="r">Est.</th><th style="width:12%" class="r">Real</th><th style="width:8%" class="r">Desv.</th>
      </tr></thead><tbody>${campo.lotes.map(l=>{
        const lp = l.ha>0?Math.round((l.hacos||0)/l.ha*100):0;
        const ld = l.rinde&&l.estRinde?l.rinde-l.estRinde:null;
        return `<tr>
          <td>${l.lote}</td><td class="r">${fmt(l.ha,1)}</td>
          <td class="r">${l.hacos>0?fmt(l.hacos,1):'<span class="muted">—</span>'}</td>
          <td><div class="lmini"><div class="mini-fill ${barClass}" style="width:${lp}%"></div></div>${lp}%</td>
          <td class="r">${l.estRinde?fmt(l.estRinde):'—'}</td>
          <td class="r">${l.rinde>0?fmt(l.rinde):'<span class="muted">—</span>'}</td>
          <td class="r ${desvClass(ld)}">${ld!=null?desvStr(ld):'—'}</td>
        </tr>`;
      }).join('')}</tbody></table>`;
      campoList.appendChild(ll);
    }
  }
  block.appendChild(campoList);
  return block;
}

function toggleEl(id,chevId){
  const el=document.getElementById(id),ch=document.getElementById(chevId);
  if(!el)return; const open=el.classList.toggle('open'); if(ch)ch.classList.toggle('open',open);
}

fetch(XLSX_URL+'?t='+Date.now())
  .then(r=>{if(!r.ok)throw new Error('No se pudo cargar el archivo');return r.arrayBuffer();})
  .then(buf=>{
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const ws=wb.Sheets['Avance cosecha'];
    if(!ws)throw new Error('No se encontró la hoja "Avance cosecha"');
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    const lotes=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i];
      const campo=r[COL.campo],cultV=r[COL.cultV];
      if(!campo||!cultV||typeof campo!=='string'||campo.startsWith('RESUMEN'))break;
      lotes.push({campo,lote:r[COL.lote]!=null?String(r[COL.lote]):'—',cultV:String(cultV).trim(),
        ha:parseFloat(r[COL.ha])||0,estRinde:parseFloat(r[COL.estRinde])||0,
        hacos:parseFloat(r[COL.hacos])||0,rinde:parseFloat(r[COL.rinde])||0});
    }
    function groupBy(cultivo){
      const f=lotes.filter(l=>l.cultV===cultivo);
      const b={};
      for(const l of f){if(!b[l.campo])b[l.campo]=[];b[l.campo].push(l);}
      return Object.entries(b).map(([nombre,lotes])=>({nombre,lotes}));
    }
    const sj1=groupBy('Sj1'),sj2=groupBy('Sj2');
    function totalStats(campos){
      const all=campos.flatMap(c=>c.lotes);
      const ha=all.reduce((s,l)=>s+l.ha,0),cos=all.reduce((s,l)=>s+l.hacos,0);
      const rinde=weightedRinde(all);
      let sEH=0,sE=0; for(const l of all){if(l.ha>0&&l.estRinde>0){sEH+=l.ha;sE+=l.ha*l.estRinde;}}
      const est=sEH>0?sE/sEH:null;
      return{ha,cos,avPct:ha>0?cos/ha:0,rinde,desv:rinde&&est?rinde-est:null};
    }
    const s1=totalStats(sj1),s2=totalStats(sj2);
    // Global totals
    const gHa  = s1.ha + s2.ha;
    const gCos = s1.cos + s2.cos;
    const gPct = gHa > 0 ? Math.round(gCos/gHa*100) : 0;
    const allL = [...sj1,...sj2].flatMap(c=>c.lotes);
    const gRinde = weightedRinde(allL);
    let gEH=0,gE=0; for(const l of allL){if(l.ha>0&&l.estRinde>0){gEH+=l.ha;gE+=l.ha*l.estRinde;}}
    const gEst = gEH>0?gE/gEH:null;
    const gDesv = gRinde&&gEst?gRinde-gEst:null;

    // ── localStorage: delta entre actualizaciones ──
    const LS_KEY = 'cosecha_snapshot';
    const DEFAULT_HA_DIA = 220;
    let prev = null;
    try { prev = JSON.parse(localStorage.getItem(LS_KEY)); } catch(e){}

    // Calcular ha/día promedio real si hay historial
    let haDia = DEFAULT_HA_DIA;
    if(prev && prev.gCos != null && prev.ts){
      const diasTransc = Math.max(1, (Date.now() - prev.ts) / 86400000);
      const haAvanzadas = gCos - prev.gCos;
      if(haAvanzadas > 0) haDia = Math.round(haAvanzadas / diasTransc);
    }
    const haPendientes = Math.max(0, gHa - gCos);
    const diasRestantes = haDia > 0 ? Math.ceil(haPendientes / haDia) : null;

    // Delta rinde
    const deltaRinde = (prev && prev.gRinde && gRinde) ? Math.round(gRinde - prev.gRinde) : null;
    // Delta ha cosechadas
    const deltaHa = (prev && prev.gCos != null) ? Math.round(gCos - prev.gCos) : null;

    // Guardar snapshot actual
    try { localStorage.setItem(LS_KEY, JSON.stringify({gCos, gRinde, ts: Date.now()})); } catch(e){}

    // ── Proyección de rinde final ──
    // Desvío % global observado
    const desvPct = (gRinde && gEst) ? (gRinde - gEst) / gEst : 0;
    // Producción real cosechada (tn)
    const prodReal = gRinde && gCos ? gRinde * gCos : 0;
    // Ha pendientes y su estimado ponderado
    const lotePend = allL.filter(l => l.hacos < l.ha);
    let pendEstHa = 0, pendEst = 0;
    for(const l of lotePend){
      const haPend = l.ha - l.hacos;
      if(haPend > 0 && l.estRinde > 0){ pendEstHa += haPend; pendEst += haPend * l.estRinde; }
    }
    const pendEstRinde = pendEstHa > 0 ? pendEst / pendEstHa : (gEst || 0);
    // Rinde proyectado pendiente = estimado corregido por desvío observado
    const pendProyRinde = pendEstRinde * (1 + desvPct);
    const prodPend = pendProyRinde * haPendientes;
    // Rinde final proyectado = (prod real + prod pendiente proyectada) / ha total
    const rindeProyFinal = gHa > 0 ? Math.round((prodReal + prodPend) / gHa) : null;
    // Producción total proyectada en tn
    const prodTotalProy = gHa > 0 ? Math.round((prodReal + prodPend) / 1000) : null;
    const desvProyVsEst = rindeProyFinal && gEst ? Math.round(rindeProyFinal - gEst) : null;

    // Helpers para badges
    function deltaBadge(val, unit=''){
      if(val==null) return '';
      const cls = val>0?'pos':val<0?'neg':'';
      const arrow = val>0?'▲':val<0?'▼':'';
      const sign = val>0?'+':'';
      return '<span class="'+cls+'" style="font-size:11px;font-weight:500;margin-left:6px">'+arrow+' '+sign+val+unit+'</span>';
    }
    function diasBadge(dias, haD){
      if(dias==null) return '';
      const label = dias<=0 ? '¡Cosecha completa!' : dias===1 ? '1 día restante' : '~'+dias+' días restantes';
      const color = dias<=3?'#C00000':dias<=7?'#B8860B':'#2E5C1E';
      return '<div style="margin-top:6px;font-size:11px;color:'+color+';font-weight:500">'+label+' <span style="color:#6b6b6b;font-weight:400">('+fmt(haD)+' ha/día)</span></div>';
    }

    document.getElementById('kpis').innerHTML=
      '<div class="kpi" style="grid-column:1/-1;background:#f0efe9;display:flex;align-items:center;gap:16px;padding:12px 14px;">'+
        '<div style="flex:1">'+
          '<div class="kpi-label">Avance global</div>'+
          '<div style="font-size:24px;font-weight:600;margin:2px 0">'+gPct+'% '+deltaBadge(deltaHa,' ha')+'</div>'+
          '<div class="kpi-sub">'+fmt(gCos)+' / '+fmt(gHa)+' ha cosechadas</div>'+
          diasBadge(diasRestantes, haDia)+
        '</div>'+
        '<div style="text-align:right">'+
          '<div class="kpi-label">Rinde global</div>'+
          '<div style="font-size:24px;font-weight:600;margin:2px 0">'+(gRinde?fmt(gRinde):'—')+' '+deltaBadge(deltaRinde,' kg/ha')+'</div>'+
          '<div class="kpi-sub '+(gDesv<0?'neg':gDesv>0?'pos':'')+'">'+(gDesv!=null?desvStr(gDesv)+' kg/ha ('+(gEst>0?(gDesv/gEst*100).toFixed(1):'—')+'%) vs est.':'—')+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="kpi"><div class="kpi-label">Sj1 avance</div><div class="kpi-val">'+Math.round(s1.avPct*100)+'%</div><div class="kpi-sub" style="color:#6b6b6b">'+fmt(s1.cos)+' / '+fmt(s1.ha)+' ha</div></div>'+
      '<div class="kpi"><div class="kpi-label">Sj1 rinde</div><div class="kpi-val">'+(s1.rinde?fmt(s1.rinde):'—')+'</div><div class="kpi-sub '+(s1.desv<0?'neg':s1.desv>0?'pos':'')+'">'+(s1.desv!=null?desvStr(s1.desv)+' kg/ha ('+(s1.rinde>0?(s1.desv/s1.rinde*100).toFixed(1):'—')+'%)':'—')+'</div></div>'+
      '<div class="kpi"><div class="kpi-label">Sj2 avance</div><div class="kpi-val">'+Math.round(s2.avPct*100)+'%</div><div class="kpi-sub" style="color:#6b6b6b">'+fmt(s2.cos)+' / '+fmt(s2.ha)+' ha</div></div>'+
      '<div class="kpi"><div class="kpi-label">Sj2 rinde</div><div class="kpi-val">'+(s2.rinde?fmt(s2.rinde):'—')+'</div><div class="kpi-sub '+(s2.desv<0?'neg':s2.desv>0?'pos':'')+'">'+(s2.desv!=null?desvStr(s2.desv)+' kg/ha ('+(s2.rinde>0?(s2.desv/s2.rinde*100).toFixed(1):'—')+'%)':'—')+'</div></div>';

    // ── Tarjeta de proyección ──
    const pctReal = gHa>0?Math.round(gCos/gHa*100):0;
    const pctPend = 100-pctReal;
    document.getElementById('proy-card').innerHTML=
      '<div class="proy-title">Proyección de rinde final de campaña</div>'+
      '<div class="proy-grid">'+
        '<div class="proy-item">'+
          '<div class="proy-label">Rinde proyectado final</div>'+
          '<div class="proy-val">'+(rindeProyFinal?fmt(rindeProyFinal):'—')+' <span style="font-size:13px;font-weight:400">kg/ha</span></div>'+
          '<div class="proy-sub '+(desvProyVsEst<0?'neg':desvProyVsEst>0?'pos':'')+'">'+(desvProyVsEst!=null?(desvProyVsEst>=0?'+':'')+fmt(desvProyVsEst)+' kg/ha vs est.':'—')+'</div>'+
        '</div>'+
        '<div class="proy-item">'+
          '<div class="proy-label">Producción total proyectada</div>'+

          '<div class="proy-seg-proy" style="width:'+pctPend+'%" title="Pendiente proyectado: '+fmt(Math.round(haPendientes))+' ha"></div>'+
        '</div>'+

        '<div style="font-size:11px;color:#6b6b6b;margin-top:6px">Pendiente: est. '+fmt(Math.round(pendEstRinde))+' kg/ha → proyectado '+fmt(Math.round(pendProyRinde))+' kg/ha (corrección '+( desvPct>=0?'+':'')+(desvPct*100).toFixed(1)+'%)</div>'+
      '</div>';

</script>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
function generarPDFCosecha(){
  const btn = document.getElementById('pdf-btn-cosecha');
  btn.textContent = '...';
  btn.disabled = true;

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
    const W = 210, margin = 14, colW = W - margin*2;
    let y = 14;
    const fecha = new Date().toLocaleDateString('es-UY',{day:'2-digit',month:'2-digit',year:'numeric'});

    // ── Header ──
    doc.setFillColor(31,78,121);
    doc.rect(0,0,W,18,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(13); doc.setFont('helvetica','bold');
    doc.text('Cosecha Soja — Litoral Norte', margin, 12);
    doc.setFontSize(9); doc.setFont('helvetica','normal');
    doc.text(fecha, W-margin, 12, {align:'right'});
    y = 26;

    // ── KPI row helper ──
    function kpiBox(x, bw, label, val, sub, subColor){
      doc.setFillColor(245,245,240);
      doc.roundedRect(x, y, bw-2, 18, 2, 2, 'F');
      doc.setTextColor(100,100,100); doc.setFontSize(7); doc.setFont('helvetica','normal');
      doc.text(label, x+3, y+5);
      doc.setTextColor(20,20,20); doc.setFontSize(13); doc.setFont('helvetica','bold');
      doc.text(String(val), x+3, y+13);
      if(sub){
        const rgb = subColor==='neg'?[192,0,0]:subColor==='pos'?[46,92,30]:[100,100,100];
        doc.setTextColor(...rgb); doc.setFontSize(7); doc.setFont('helvetica','normal');
        doc.text(String(sub), x+3, y+17);
      }
    }

    // Global KPI box (full width)
    const gEl = document.getElementById('kpis');
    const kpis = gEl ? gEl.querySelectorAll('.kpi') : [];

    // Read computed values from DOM
    function kpiText(el){ return el ? el.querySelector('.kpi-val')?.textContent?.trim() : '—'; }
    function kpiSub(el){ return el ? el.querySelector('.kpi-sub')?.textContent?.trim() : ''; }
    function kpiLbl(el){ return el ? el.querySelector('.kpi-label')?.textContent?.trim() : ''; }

    // Global summary bar
    doc.setFillColor(31,78,121);
    doc.roundedRect(margin, y, colW, 20, 2, 2, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');

    // Get global values from first KPI block (the wide one)
    const globalDiv = gEl?.querySelector('[style*="grid-column"]');
    const avLabel = globalDiv?.querySelectorAll('.kpi-label')?.[0]?.textContent || 'Avance global';
    const avVal   = globalDiv?.querySelectorAll('.kpi-val, [style*="24px"]');
    const avText  = globalDiv ? (globalDiv.querySelectorAll('div[style*="24px"]')[0]?.textContent?.replace(/[▲▼]/g,'').trim() || '—') : '—';
    const rnText  = globalDiv ? (globalDiv.querySelectorAll('div[style*="24px"]')[1]?.textContent?.replace(/[▲▼]/g,'').trim() || '—') : '—';
    const haText  = globalDiv?.querySelector('.kpi-sub')?.textContent?.trim() || '';

    doc.text('Avance: '+avText, margin+4, y+8);
    doc.text('Rinde: '+rnText+' kg/ha', margin+4, y+15);
    doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(haText, W-margin-2, y+11, {align:'right'});
    y += 24;

    // Sj1 / Sj2 KPIs
    const kpiArr = Array.from(kpis).filter(k=>!k.style.gridColumn);
    const bw = colW/4;
    kpiArr.forEach((k,i)=>{
      kpiBox(margin + i*bw, bw, kpiLbl(k), kpiText(k), kpiSub(k),
        k.querySelector('.neg')?'neg':k.querySelector('.pos')?'pos':'');
    });
    y += 22;

    // ── Proyección ──
    const proyCard = document.getElementById('proy-card');
    if(proyCard){
      const pItems = proyCard.querySelectorAll('.proy-item');
      if(pItems.length >= 2){
        doc.setFillColor(240,239,233);
        doc.roundedRect(margin, y, colW, 16, 2, 2, 'F');
        doc.setTextColor(100,100,100); doc.setFontSize(7); doc.setFont('helvetica','normal');
        doc.text('PROYECCIÓN FINAL DE CAMPAÑA', margin+3, y+5);
        const p0v = pItems[0].querySelector('.proy-val')?.textContent?.trim() || '—';
        const p0s = pItems[0].querySelector('.proy-sub')?.textContent?.trim() || '';
        const p1v = pItems[1].querySelector('.proy-val')?.textContent?.trim() || '—';
        const p1s = pItems[1].querySelector('.proy-sub')?.textContent?.trim() || '';
        doc.setTextColor(20,20,20); doc.setFontSize(10); doc.setFont('helvetica','bold');
        doc.text('Rinde proy.: '+p0v, margin+3, y+12);
        doc.text('Producción: '+p1v, margin+colW/2+3, y+12);
        doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(100,100,100);
        doc.text(p0s, margin+3, y+16);
        doc.text(p1s, margin+colW/2+3, y+16);
        y += 20;
      }
    }

    // ── Tabla por campo ──
    doc.setFillColor(31,78,121);
    doc.rect(margin, y, colW, 7, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(8); doc.setFont('helvetica','bold');
    const cols = [{t:'Campo',x:margin+2,w:38},{t:'Cultivo',x:margin+40,w:16},{t:'Ha',x:margin+57,w:18,r:true},
      {t:'Cosechadas',x:margin+76,w:22,r:true},{t:'Avance',x:margin+99,w:18,r:true},
      {t:'Est. kg/ha',x:margin+118,w:22,r:true},{t:'Real kg/ha',x:margin+141,w:22,r:true},{t:'Desvío',x:margin+164,w:18,r:true}];
    cols.forEach(col=>{ doc.text(col.t, col.r ? col.x+col.w : col.x, y+5, col.r?{align:'right'}:{}); });
    y += 9;

    // Parse campo-level data from DOM
    const blocks = document.getElementById('blocks');
    if(blocks){
      const cultBlocks = blocks.querySelectorAll('.card');
      let row = 0;
      cultBlocks.forEach(cb=>{
        const cultName = cb.querySelector('.pill')?.textContent?.trim() || '';
        const campoRows = cb.querySelectorAll('.campo-row');
        campoRows.forEach(cr=>{
          if(cr.classList.contains('no-data')) return;
          const tds = cr.querySelectorAll('span');
          const campoNm = cr.querySelector('.campo-name')?.textContent?.trim() || '';
          const pct     = cr.querySelector('.campo-pct')?.textContent?.trim() || '—';
          const desv    = cr.querySelector('.campo-desv')?.textContent?.trim() || '—';
          const meta    = cr.querySelector('.campo-rinde')?.textContent?.trim() || '—';

          // Get ha from lote table
          const loteTable = document.getElementById('lotes-'+cultName.replace(/\s/g,'').toLowerCase()+'-'+campoNm.replace(/\s/g,'').toLowerCase());
          let haT='—',cosT='—',estT='—';
          if(loteTable){
            const rows2 = loteTable.querySelectorAll('tbody tr');
            let sumHa=0,sumCos=0,sumEstW=0,sumEstH=0;
            rows2.forEach(r2=>{
              const tds2=r2.querySelectorAll('td');
              const ha2=parseFloat((tds2[1]?.textContent||'0').replace(/\./g,'').replace(',','.'))||0;
              const cos2=parseFloat((tds2[2]?.textContent||'0').replace(/\./g,'').replace(',','.'))||0;
              const est2=parseFloat((tds2[4]?.textContent||'0').replace(/\./g,'').replace(',','.'))||0;
              sumHa+=ha2; sumCos+=isNaN(cos2)?0:cos2; if(est2>0){sumEstW+=ha2*est2;sumEstH+=ha2;}
            });
            haT=sumHa>0?sumHa.toLocaleString('es-UY',{maximumFractionDigits:0}):'—';
            cosT=sumCos>0?sumCos.toLocaleString('es-UY',{maximumFractionDigits:0}):'—';
            estT=sumEstH>0?Math.round(sumEstW/sumEstH).toLocaleString('es-UY'):'—';
          }

          const bg = row%2===0?[255,255,255]:[248,248,245];
          doc.setFillColor(...bg); doc.rect(margin, y, colW, 7, 'F');
          doc.setTextColor(20,20,20); doc.setFontSize(8); doc.setFont('helvetica','normal');
          doc.text(campoNm, margin+2, y+5);
          doc.text(cultName, margin+40, y+5);
          doc.text(haT, margin+75, y+5, {align:'right'});
          doc.text(cosT, margin+98, y+5, {align:'right'});
          doc.text(pct, margin+117, y+5, {align:'right'});
          doc.text(estT, margin+140, y+5, {align:'right'});
          doc.text(meta.replace('kg/ha','').trim(), margin+163, y+5, {align:'right'});
          const dColor = desv.startsWith('-')?[192,0,0]:desv.startsWith('+')||(!desv.startsWith('-')&&desv!=='—')?[46,92,30]:[100,100,100];
          doc.setTextColor(...dColor);
          doc.text(desv, margin+colW, y+5, {align:'right'});
          y += 7; row++;
          if(y > 270){ doc.addPage(); y=14; }
        });
      });
    }

    // Footer
    doc.setTextColor(150,150,150); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text('Ceibos Group Uruguay · Litoral Norte · '+fecha, W/2, 290, {align:'center'});

    doc.save('Cosecha_LitoralNorte_'+fecha.replace(/\//g,'-')+'.pdf');
  } catch(e) {
    alert('Error generando PDF: '+e.message);
  }
  btn.textContent = '⬇ PDF';
  btn.disabled = false;
}
</script>
